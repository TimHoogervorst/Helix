[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "helix-core"
version = "0.1.0"
description = "Helix Core — Platform SDK for the Helix open-source ELN/LIMS"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.1,<5.2",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
    "djangorestframework>=3.15,<3.16",
]

[project.scripts]
helix-mod-catalog = "helix_core.mod_system.catalog_cli:main"
helix-mod-validate = "helix_core.mod_system.validator_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["helix_core*", "bundled*"]

[tool.setuptools.package-data]
helix_core = ["mod_system/*.json"]
