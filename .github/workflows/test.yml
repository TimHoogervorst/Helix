name: Test

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: openscience
          POSTGRES_USER: openscience
          POSTGRES_PASSWORD: openscience
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openscience"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r src/server/requirements.txt -r src/server/requirements-dev.txt
      - name: Run backend tests
        working-directory: src
        run: pytest -n auto
        env:
          DATABASE_URL: postgres://openscience:openscience@localhost:5432/openscience
          SECRET_KEY: ci-secret-key
          DEBUG: "true"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
