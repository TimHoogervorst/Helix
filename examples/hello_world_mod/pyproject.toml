[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-world-mod"
version = "1.0.0"
description = "The Helix hello-world dual-artifact Mod template"
requires-python = ">=3.11"
dependencies = ["helix-core>=1.0.0"]

[project.entry-points."helix.mods"]
"example.helloworld" = "hello_world_mod"

[tool.setuptools]
packages = ["hello_world_mod", "hello_world_mod.migrations"]
package-dir = {"hello_world_mod" = "."}

[tool.setuptools.package-data]
hello_world_mod = ["modManifest.json", "migrations/*.py"]
