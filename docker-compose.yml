services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: openscience
      POSTGRES_USER: openscience
      POSTGRES_PASSWORD: openscience
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openscience"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./src/server:/app
      - ./src/mods:/mods
    environment:
      DATABASE_URL: postgres://openscience:openscience@db:5432/openscience
      SECRET_KEY: dev-secret-key-change-in-production
      DEBUG: "true"
      ALLOW_SELF_REGISTRATION: "false"
      SEED_USERNAME: ""
      SEED_PASSWORD: ""
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    volumes:
      - ./src/shell:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
