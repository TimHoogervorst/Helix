[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-world-mod"
version = "1.0.0"
description = "The Helix hello-world dual-artifact Mod template"
requires-python = ">=3.11"
dependencies = ["helix-core>=1.0.0"]

[project.entry-points."helix.mods"]
"example.helloworld" = "mods.hello_world"

[tool.setuptools]
package-dir = {"" = "../.."}

[tool.setuptools.packages.find]
where = ["../.."]
include = ["mods.hello_world*"]

[tool.setuptools.package-data]
"mods.hello_world" = ["modManifest.json", "migrations/*.py"]
